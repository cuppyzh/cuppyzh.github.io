<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cuppyzh — soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* eucalyptus flat palette */
      --color-paper: #f0f2ec;
      --color-surface: #fafbf7;
      --color-ink: #26332a;
      --color-ink-soft: #5c6f60;
      --color-euca: #3e7c5b;
      --color-euca-deep: #2f6147;

      --font-display: "Space Grotesk", system-ui, sans-serif;
      --font-mono: "Space Mono", monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-family: var(--font-display);
    }

    body {
      min-height: 100vh;
      background: var(--color-paper);
      color: var(--color-ink);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      margin: 0 auto;
      display: flex;
      min-height: 100vh;
      width: 100%;
      max-width: 24rem;
      flex-direction: column;
      padding: 2rem 1.25rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--color-ink);
      padding-bottom: 1rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      text-transform: uppercase;
    }

    header span {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-ink-soft);
    }

    main {
      margin-top: 2rem;
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--color-ink-soft);
      border-radius: 0.75rem;
      background: var(--color-surface);
      padding: 3rem 1.5rem;
      text-align: center;
    }

    main h2 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      text-transform: uppercase;
      color: var(--color-euca-deep);
    }

    main p {
      margin-top: 1rem;
      max-width: 26ch;
      font-size: 0.875rem;
      line-height: 1.625;
      color: var(--color-ink-soft);
    }

    .dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background: var(--color-euca);
      margin-bottom: 1.5rem;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    footer {
      margin-top: 2.5rem;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-ink-soft);
    }

    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      height: 100%;
      width: 100%;
      opacity: 0.35;
      mix-blend-mode: soft-light;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>cuppyzh</h1>
      <span>v0.1</span>
    </header>

    <main>
      <span class="dot" aria-hidden="true"></span>
      <h2>Soon</h2>
      <p>Something is brewing here. Check back in a little while.</p>
    </main>

    <footer>&copy; 2026 cuppyzh</footer>
  </div>

  <!-- Grain overlay: fine print texture, soft-light keeps contrast -->
  <svg class="grain" aria-hidden="true">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <rect width="100%" height="100%" filter="url(#grain)" />
  </svg>
</body>
</html>
